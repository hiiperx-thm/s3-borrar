
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - mkdir -p "$HOME/.local/bin"
        - curl -sL https://github.com/gohugoio/hugo/releases/download/v0.169.0/hugo_0.169.0_linux-amd64.tar.gz -o hugo.tar.gz
        - tar -xzf hugo.tar.gz -C "$HOME/.local/bin" hugo
        - chmod +x "$HOME/.local/bin/hugo"
        - git submodule update --init --recursive
    build:
      commands:
        - '"$HOME/.local/bin/hugo" --gc --minify'
  artifacts:
    baseDirectory: public
    files:
      - '**/*'
